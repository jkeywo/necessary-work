[package]
name = "nw-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "nw-client"
path = "src/main.rs"

# The Bevy dependency lives here and only here: nw-simulation and nw-content
# must never acquire it (see pasm/spec/core/decisions.yaml). The client is a
# non-authoritative view over the command/state interface.
[dependencies]
nw-content = { workspace = true }
nw-simulation = { workspace = true }
bevy = { workspace = true }

# Browser-only: seed derivation from Date.now(); wasm-bindgen is already in
# the tree through Bevy and stays version-locked with it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

[lints]
workspace = true
