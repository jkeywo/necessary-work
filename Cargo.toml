[workspace]
resolver = "2"
members = [
  "crates/nw-content",
  "crates/nw-simulation",
  "crates/nw-persistence",
  "crates/nw-headless",
  "crates/nw-tools",
  "crates/nw-client",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/jkeywo/necessary-work"

[workspace.dependencies]
# Internal crates. Dependency direction keeps the simulation pure: content and
# simulation never depend on the client, and Bevy never reaches the simulation.
nw-content = { path = "crates/nw-content" }
nw-simulation = { path = "crates/nw-simulation" }
nw-persistence = { path = "crates/nw-persistence" }

# External crates
# webgl2 is explicit so the browser build never silently requires WebGPU.
bevy = { version = "0.16", features = ["webgl2"] }
serde = { version = "1", features = ["derive"] }
ron = "0.8"
postcard = { version = "1", features = ["alloc"] }

# The fleet's shared foundation, pinned to a rev like every vellum dependency;
# bumping it is a PR whose diff touches only manifests and lockfiles. For
# local work against a checkout, use a gitignored .cargo/config.toml [patch].
vellum-digest = { git = "https://github.com/jkeywo/vellum", rev = "8688ec0243982decf2ffc05883d9ff8b22606fa6" }
vellum-rng = { git = "https://github.com/jkeywo/vellum", rev = "8688ec0243982decf2ffc05883d9ff8b22606fa6" }
vellum-corpus = { git = "https://github.com/jkeywo/vellum", rev = "8688ec0243982decf2ffc05883d9ff8b22606fa6" }
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "deny"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

# Keep the Bevy client responsive in dev builds without slowing our own
# edit-compile loop: optimize dependencies, not workspace code.
[profile.dev.package."*"]
opt-level = 3
