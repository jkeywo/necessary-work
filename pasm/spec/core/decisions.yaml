# Design and technical decisions carried over from the design pack, each
# recording what it binds and why. These are the decisions the rest of the spec
# assumes; changing one is a deliberate act with a diff that says so.

entities:
  - reference: design-pack-and-discussion
    core:
      status: accepted
      confidence: confirmed
      title: Source design pack and initial discussion
      summary: >-
        This spec is the living model derived from the prototype design pack
        (six documents, archived under docs/design) and the initial design
        discussion. The design pack consolidates the decisions; details not
        needed to begin implementation were deferred there rather than invented,
        and the same restraint applies here.
      rationale:
        - "Design pack: docs/design/ (development roadmap, feature list, simulation contract, learning goals and guardrails, research and sources, production assumptions)."
        - "Initial design discussion: https://chatgpt.com/share/6a61cd47-2e68-83eb-a48a-47c250b5a6f9"

  - decision: pure-rust-simulation-boundary
    core:
      status: accepted
      confidence: confirmed
      title: The simulation is a pure Rust library behind a command/state interface
      summary: >-
        The simulation is a pure Rust library independent of Bevy, rendering, the
        OS, save UI, and network code, so the same core serves the native client,
        the WASM client, headless tests, deterministic replay, batch balance
        runs, and debug inspection. Dependency direction keeps Bevy out of the
        simulation.
      references: [pure-simulation-core, bevy-client]

  - decision: integer-fixed-point-math
    core:
      status: accepted
      confidence: confirmed
      title: Integer and fixed-point rules math only
      summary: >-
        All authoritative arithmetic uses integers or fixed-point, never
        floating-point outcomes, so native x86-64 and wasm32 builds cannot
        diverge. Emissions are stored as integers and displayed rounded.
      references: [canonical-units]

  - decision: data-defined-effect-vocabulary
    core:
      status: accepted
      confidence: confirmed
      title: Projects act only through a controlled, data-defined effect vocabulary
      summary: >-
        Every project effect is one of a controlled family with an explicit
        scope; no effect silently becomes global. A project using existing
        mechanics is content extension; a new effect type or causal system is
        mechanic extension and requires architecture review. Rhai scripting is
        deferred and only ever for behaviour the vocabulary cannot express.
      references: [controlled-effect-vocabulary]

  - decision: ron-content-format
    core:
      status: accepted
      confidence: confirmed
      title: Authored content is human-reviewable structured data
      summary: >-
        Content is human-reviewable structured data (RON chosen for first-class
        Rust support) with schema validation, stable ids, explicit units and
        scopes, source metadata, linting, and content hashes. No arbitrary
        scripts through Alpha 1.
      references: [authored-content-catalogue]

  - decision: single-authored-speed
    core:
      status: accepted
      confidence: confirmed
      title: One authored speed, no player-facing fast-forward
      summary: >-
        The simulation runs in real time at one authored speed with pause but no
        player-facing fast-forward, because the prototype must prove that
        normal-speed pacing stands on its own. Debug builds may accelerate time,
        which invalidates ranked records unless explicitly supported.
      references: [time-and-controls, benchmark-timing]

  - decision: no-loss-state-prototype
    core:
      status: accepted
      confidence: confirmed
      title: The 1990 prototype cannot be lost
      summary: >-
        There is no loss state, no climate crises, and no unrecoverable
        penalties; every valid start has a path to victory. This isolates the
        economy for testing and reflects a deliberate scope boundary, not a claim
        that real delay was harmless. Genuine loss conditions arrive only with
        2020 mode.
      references: [recoverability-and-victory, counterfactual-not-easy]

  - decision: named-deterministic-rng-streams
    core:
      status: accepted
      confidence: confirmed
      title: Independent named RNG streams
      summary: >-
        Randomness uses independent named streams (starting_variation,
        opportunity_timing, opportunity_selection), each derived from the seed
        plus a stable identifier, so adding a draw to one system cannot perturb
        another and balance tests can fix or disable them.
      references: [named-rng-streams]

  - decision: command-log-authoritative
    core:
      status: accepted
      confidence: confirmed
      title: The command log is the authoritative save
      summary: >-
        A run's authoritative record is its scenario, seed, and ordered
        timestamped semantic command log. Snapshots may cache state for fast
        loading, but replay from the command log is authoritative. Compatibility
        is version-specific; old records are archived, not converted.
      references: [saves-logs-validation, semantic-command-boundary]

  - decision: workspace-crate-architecture
    core:
      status: accepted
      confidence: confirmed
      title: Six-crate headless-first workspace
      summary: >-
        The workspace is nw-content (schemas, loading, validation, project data),
        nw-simulation (deterministic pure core), nw-persistence (snapshots, logs,
        records, archive), nw-headless (replay, bots, batch runs, benchmarks),
        nw-tools (content linting and balance reports), and nw-client (Bevy
        application). Content and simulation never depend on the client.
      references:
        - pure-simulation-core
        - authored-content-catalogue
        - saves-logs-validation
        - headless-toolchain
        - content-tooling
        - bevy-client

  - decision: bevy-deferred-until-ui-spike
    core:
      status: accepted
      confidence: confirmed
      title: Bevy was deferred until the UI spike, then crossed deliberately
      summary: >-
        The nw-client crate was scaffolded without Bevy until the deterministic
        core, the full project catalogue, and the calculation/preview layer were
        proven — which kept the boundary structurally uncrossable during core
        development. The UI spike then added Bevy 0.16 to nw-client and only
        nw-client; the simulation and content crates still cannot reach it.
      references: [bevy-client, pure-simulation-boundary-note, bevy-016-immediate-rebuild-dashboard]

  - decision: score-is-time-only
    core:
      status: accepted
      confidence: confirmed
      title: The score is completion time only
      summary: >-
        The only score is active, unpaused completion time, compared against
        provisional handcrafted benchmark brackets that are replaced by an
        empirical reference distribution once the sample is large and
        representative. Scoring must not moralise or claim a false percentile.
      references: [completion-and-records, scoring-is-not-a-moral-grade]

  # Decisions made while implementing the Stage 1 deterministic core.

  - decision: realized-effects-lock-at-completion
    core:
      status: accepted
      confidence: confirmed
      title: A completion locks its scaled magnitudes; icons never act retroactively
      summary: >-
        A project's emissions reductions are scaled by the lead continent's
        icons at the moment of completion and stored as realised effects.
        Completed projects therefore never grow retroactively as icons
        accumulate, and a preview computed by hypothetically realising against a
        copy of the state equals the realised effect under unchanged conditions
        by construction — the preview-accuracy test obligation holds
        structurally rather than by parallel arithmetic. Linear-rollout partials
        use current scaling until completion locks them, per the tick order's
        partial-rollout recalculation step.
      references: [project-comparison-preview, scaling-and-breakpoints, fixed-tick-order]

  - decision: derived-state-recomputed-per-tick
    core:
      status: accepted
      confidence: confirmed
      title: Derived state is recomputed from the standing lists every tick
      summary: >-
        Icons, sector emissions, income deltas, mandate maximum, unlocks, and
        slot milestones are recomputed each tick from baselines plus the
        standing completed and active project lists. Cancellation and
        decommission cleanup are therefore exact by construction — removing the
        entry removes every trace of it — rather than maintained by paired
        add/remove bookkeeping that could drift. The completions-ever counter
        that prices cost curves is deliberately not derived: it never
        decrements, so decommission-and-rebuild toggling is never profitable.
      references: [project-lifecycle, fixed-tick-order]

  - decision: in-crate-pcg32-and-fnv
    core:
      status: accepted
      confidence: confirmed
      title: Hand-rolled PCG32 and FNV-1a, in-crate
      summary: >-
        The named RNG streams use an in-crate PCG-XSH-RR 64/32 (seeded through
        SplitMix64 with the stream identifier folded in) and digests use
        in-crate FNV-1a 64 over postcard bytes, mirroring the choice rogue-hunter
        proved: no dependency upgrade can silently change replays, and the
        target-independent encoding keeps native and WASM digests identical.
      references: [named-rng-streams, saves-logs-validation, integer-fixed-point-math]

  - decision: unlocks-are-a-ratchet
    core:
      status: accepted
      confidence: confirmed
      title: Project unlocks persist once granted
      summary: >-
        Decommissioning removes a project's benefits, icons, spillovers, and
        upkeep — but not the unlocks it granted. An unlock is knowledge, and
        knowledge once gained stays gained. Programme slots ratchet the same
        way: a milestone once passed keeps its slot even if the Institutions
        stock later falls.
      references: [project-lifecycle, programme-slots]

  - decision: pure-simulation-boundary-note
    core:
      status: accepted
      confidence: confirmed
      title: The boundary is enforced by crate structure
      summary: >-
        The Bevy-out-of-simulation rule is enforced structurally: nw-simulation
        and nw-content declare no dependency on nw-client, and the Bevy
        dependency lives in nw-client's manifest alone, so the simulation cannot
        acquire a rendering dependency by accident.
      references: [pure-simulation-core, bevy-client]

  - decision: bevy-016-immediate-rebuild-dashboard
    core:
      status: accepted
      confidence: confirmed
      title: Bevy 0.16 dashboard rebuilt whole on every state change
      summary: >-
        The spike client uses Bevy 0.16 UI nodes and rebuilds the entire dynamic
        dashboard tree whenever the simulation ticks or the player acts — an
        immediate-mode approach in retained clothing. At four authored ticks per
        second the rebuild is cheap, and it makes desynchronised UI structurally
        impossible: there is no per-widget update path to forget. The simulation
        advances on Bevy's fixed timestep at the scenario's authored speed, so
        the client has no speed authority; pause flows through the same
        Pause/Resume commands as any client. Dev-only env hooks (NW_SEED,
        NW_SMOKE_SECS, NW_SHOT, NW_DEMO) let CI and agents boot, screenshot, and
        exit the app without a human, and touch nothing authoritative. Revisit
        the rebuild granularity only if profiling ever says so.
      references: [bevy-client, single-authored-speed, semantic-command-boundary]

  - decision: vellum-adoption
    core:
      status: accepted
      confidence: confirmed
      title: The shared foundation is adopted where it fits, and refused where it does not
      summary: >-
        Three vellum crates are in: vellum-digest (fnv1a and digest_postcard
        were byte-identical to the in-crate versions, so adoption moved no
        value anywhere), vellum-rng (the fleet construction with this crate's
        named streams hashed into selectors, replacing a different seed mix
        and slightly biased modulo draws — no pinned run fixtures existed, so
        the only gate was that both seeded bots keep winning, which they do),
        and vellum-corpus (the headless batch command runs on the shared
        drive/tally/permille machinery). vellum-replay's Simulation trait is
        deliberately NOT adopted: it models command-driven replay, and this
        game's log is tick-stamped real time — periodic hash sampling, budget
        and stall detection live in nw-persistence because the scheduler
        encodes the genre, exactly as the fleet charter says.
      references: [named-rng-streams, saves-logs-validation]
